[project]
name = "market-core"
version = "0.0.0"
description = "A-share market domain core (instruments, calendar, providers)"
requires-python = "==3.12.13"
dependencies = [
    "ashare-contracts",
    "pydantic==2.12.5",
    "tzdata==2025.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.uv.sources]
ashare-contracts = { workspace = true }

# Kunlun Alpha — P0-N11 本地数据基础设施
#
# Usage:
#   cp .env.example .env          # first time only
#   docker compose up -d          # start
#   docker compose ps             # status
#   docker compose down           # stop (keeps volumes)
#   docker compose down -v        # stop and delete data
#
# Ports:
#   PostgreSQL:  5432
#   Redis:       6379
#   ClickHouse:  8123 (HTTP), 9000 (native)
#   MinIO:       9000 (API), 9001 (console)
#   Prometheus:  9090 (metrics)
#   Grafana:     3001 (dashboards)
#   Loki:        3100 (logs)
#   Tempo:       4317 (OTLP gRPC), 4318 (OTLP HTTP)

services:
  # ==========================================================================
  # PostgreSQL — 业务数据 (TypeORM)
  # ==========================================================================
  postgres:
    image: postgres:17-alpine
    container_name: kunlun-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kunlun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kunlun-local-dev}
      POSTGRES_DB: ${POSTGRES_DB:-kunlun}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kunlun} -d ${POSTGRES_DB:-kunlun}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "kunlun.service=postgres"
      - "kunlun.description=Business data (TypeORM)"

  # ==========================================================================
  # Redis — 实时状态、缓存、锁、排行榜
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: kunlun-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-kunlun-local-dev}
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-kunlun-local-dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "kunlun.service=redis"
      - "kunlun.description=Cache, locks, real-time state"

  # ==========================================================================
  # ClickHouse — 时序行情、情绪轮动、Feature 分析数据
  # ==========================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:25-alpine
    container_name: kunlun-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-kunlun}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-kunlun-local-dev}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-kunlun}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native protocol
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./init/clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user ${CLICKHOUSE_USER:-kunlun} --password ${CLICKHOUSE_PASSWORD:-kunlun-local-dev} --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "kunlun.service=clickhouse"
      - "kunlun.description=Time-series market data & features"

  # ==========================================================================
  # MinIO — S3 兼容对象存储 (替代 COS 本地开发)
  # ==========================================================================
  minio:
    image: minio/minio:RELEASE.2025-07-18T21-56-31Z
    container_name: kunlun-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kunlun}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kunlun-local-dev}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "kunlun.service=minio"
      - "kunlun.description=S3-compatible object storage (local COS substitute)"

  # ==========================================================================
  # MinIO Bucket Initializer — 首次启动创建默认桶
  # ==========================================================================
  minio-init:
    image: minio/mc:RELEASE.2025-07-18T21-56-31Z
    container_name: kunlun-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-kunlun} ${MINIO_ROOT_PASSWORD:-kunlun-local-dev};
      /usr/bin/mc mb --ignore-existing local/${MINIO_DEFAULT_BUCKETS:-kunlun-data};
      echo 'MinIO bucket ${MINIO_DEFAULT_BUCKETS:-kunlun-data} ready';
      exit 0;
      "
    labels:
      - "kunlun.service=minio-init"
      - "kunlun.description=One-shot bucket creation"

  # ==========================================================================
  # Prometheus — 指标采集与时序存储
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: kunlun-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "kunlun.service=prometheus"
      - "kunlun.description=Metrics collection & TSDB"

  # ==========================================================================
  # Grafana — 可视化仪表盘
  # ==========================================================================
  grafana:
    image: grafana/grafana:11.8.0
    container_name: kunlun-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-kunlun-local-dev}
    ports:
      - "3001:3000"
    volumes:
      - ../grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../grafana/dashboards/provisioning:/etc/grafana/provisioning/dashboards:ro
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards/kunlun:ro
      - ./data/grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "kunlun.service=grafana"
      - "kunlun.description=Visualization dashboards"

  # ==========================================================================
  # Loki — 日志聚合与存储
  # ==========================================================================
  loki:
    image: grafana/loki:3.6.2
    container_name: kunlun-loki
    restart: unless-stopped
    command: "-config.file=/etc/loki/loki-config.yml"
    ports:
      - "3100:3100"
    volumes:
      - ../loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./data/loki:/loki
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "kunlun.service=loki"
      - "kunlun.description=Log aggregation"

  # ==========================================================================
  # Grafana Tempo — 分布式追踪后端
  # ==========================================================================
  tempo:
    image: grafana/tempo:2.9.0
    container_name: kunlun-tempo
    restart: unless-stopped
    command: "-config.file=/etc/tempo/tempo-config.yml"
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "3200:3200"   # Query frontend (for Grafana)
    volumes:
      - ../tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - ./data/tempo:/var/tempo
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "kunlun.service=tempo"
      - "kunlun.description=Distributed tracing backend"

# Local application overlay.
# Combine this file with docker-compose.yml; it never removes named or bind volumes.

services:
  clickhouse-migrate:
    image: clickhouse/clickhouse-server:25.8.24.21-alpine
    container_name: kunlun-clickhouse-migrate
    restart: "no"
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-kunlun}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-kunlun-local-dev}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-kunlun}
    volumes:
      - ../clickhouse/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for file in /migrations/*.sql; do
          echo "Applying $${file}"
          clickhouse-client \
            --host clickhouse \
            --user "$${CLICKHOUSE_USER}" \
            --password "$${CLICKHOUSE_PASSWORD}" \
            --database "$${CLICKHOUSE_DB}" \
            --multiquery < "$${file}"
        done
    labels:
      - "kunlun.service=clickhouse-migrate"
      - "kunlun.description=Idempotent ClickHouse schema migration"

  server-migrate:
    image: kunlun-server:local
    build:
      context: ../..
      dockerfile: Dockerfile
      target: server
    container_name: kunlun-server-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KUNLUN_POSTGRES_DSN: >-
        postgresql://${POSTGRES_USER:-kunlun}:${POSTGRES_PASSWORD:-kunlun-local-dev}@postgres:5432/${POSTGRES_DB:-kunlun}?options=-csearch_path%3Dkunlun%2Cpublic
    command: ["node", "apps/server/dist/migrate.js"]
    labels:
      - "kunlun.service=server-migrate"
      - "kunlun.description=Idempotent PostgreSQL schema migration"

  data-worker-migrate:
    image: kunlun-data-worker-migrate:local
    build:
      context: ../..
      dockerfile: Dockerfile
      target: data-worker-migrate
    container_name: kunlun-data-worker-migrate
    restart: "no"
    depends_on:
      server-migrate:
        condition: service_completed_successfully
    environment:
      KUNLUN_POSTGRES_DSN: >-
        postgresql://${POSTGRES_USER:-kunlun}:${POSTGRES_PASSWORD:-kunlun-local-dev}@postgres:5432/${POSTGRES_DB:-kunlun}?options=-csearch_path%3Dkunlun%2Cpublic
    command:
      - python
      - -c
      - |
        import os
        import psycopg
        from data_worker.storage.migrations import apply_data_worker_migrations

        with psycopg.connect(os.environ["KUNLUN_POSTGRES_DSN"]) as connection:
            apply_data_worker_migrations(connection)
        print("Data-worker PostgreSQL migration verified")
    labels:
      - "kunlun.service=data-worker-migrate"
      - "kunlun.description=Verified data-worker schema migrations"

  local-terminal-reference-materialize:
    image: kunlun-data-worker:local
    build:
      context: ../..
      dockerfile: Dockerfile
      target: data-worker
    container_name: kunlun-local-terminal-reference-materialize
    restart: "no"
    depends_on:
      server-migrate:
        condition: service_completed_successfully
    environment:
      KUNLUN_POSTGRES_DSN: >-
        postgresql://${POSTGRES_USER:-kunlun}:${POSTGRES_PASSWORD:-kunlun-local-dev}@postgres:5432/${POSTGRES_DB:-kunlun}?options=-csearch_path%3Dkunlun%2Cpublic
      KUNLUN_POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-kunlun}
      LOCAL_TERMINAL_REFERENCE_FILE: /workspace/data/reference/local-terminal-instruments-v1.json
    command: ["local-terminal-reference-materialize"]
    labels:
      - "kunlun.service=local-terminal-reference-materialize"
      - "kunlun.description=Versioned local terminal instrument and sector reference"

  ranking-terminal-materialize:
    image: kunlun-data-worker:local
    build:
      context: ../..
      dockerfile: Dockerfile
      target: data-worker
    container_name: kunlun-ranking-terminal-materialize
    restart: "no"
    depends_on:
      clickhouse-migrate:
        condition: service_completed_successfully
      local-terminal-reference-materialize:
        condition: service_completed_successfully
      quant-engine:
        condition: service_healthy
    environment:
      LOCAL_TERMINAL_REFERENCE_FILE: /workspace/data/reference/local-terminal-instruments-v1.json
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-kunlun}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-kunlun}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-kunlun-local-dev}
      QUANT_ENGINE_URL: http://quant-engine:8081
      RANKING_MATERIALIZER_TIMEOUT_SECONDS: "5"
    command: ["ranking-snapshot-materialize"]
    labels:
      - "kunlun.service=ranking-terminal-materialize"
      - "kunlun.description=Point-in-time real local market ranking publication"

  market-data-sync:
    profiles: ["real-market-data"]
    image: kunlun-data-worker:local
    build:
      context: ../..
      dockerfile: Dockerfile
      target: data-worker
    container_name: kunlun-market-data-sync
    restart: "on-failure:5"
    init: true
    depends_on:
      clickhouse-migrate:
        condition: service_completed_successfully
    environment:
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-akshare}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      TUSHARE_API_URL: ${TUSHARE_API_URL:-https://api.tushare.pro}
      MARKET_DATA_SYMBOLS: >-
        ${MARKET_DATA_SYMBOLS:-600519.SH}
      MARKET_DATA_MINUTE_SYMBOLS: ${MARKET_DATA_MINUTE_SYMBOLS:-}
      MARKET_DATA_RAW_ROOT: /workspace/var/market-raw
      MARKET_DATA_RUN_MODE: ${MARKET_DATA_RUN_MODE:-once}
      MARKET_DATA_POLL_SECONDS: ${MARKET_DATA_POLL_SECONDS:-60}
      MARKET_DATA_DAILY_LOOKBACK_DAYS: ${MARKET_DATA_DAILY_LOOKBACK_DAYS:-730}
      MARKET_DATA_MINUTE_INTERVAL: ${MARKET_DATA_MINUTE_INTERVAL:-MINUTE_1}
      MARKET_DATA_SETTINGS_URL: ${MARKET_DATA_SETTINGS_URL:-}
      MARKET_DATA_SETTINGS_WORKER_TOKEN: ${MARKET_DATA_SETTINGS_WORKER_TOKEN:-}
      MARKET_DATA_SETTINGS_ALLOW_LOCAL_HTTP: ${MARKET_DATA_SETTINGS_ALLOW_LOCAL_HTTP:-false}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-kunlun}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-kunlun}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-kunlun-local-dev}
      CLICKHOUSE_TIMEOUT_SECONDS: ${CLICKHOUSE_TIMEOUT_SECONDS:-5}
    volumes:
      - kunlun-market-raw:/workspace/var/market-raw
    command: ["market-data-sync"]
    labels:
      - "kunlun.service=market-data-sync"
      - "kunlun.description=Raw-first real market Bar synchronization"

  limit-pool-terminal-materialize:
    image: kunlun-data-worker:local
    build:
      context: ../..
      dockerfile: Dockerfile
      target: data-worker
    container_name: kunlun-limit-pool-terminal-materialize
    restart: "no"
    depends_on:
      clickhouse-migrate:
        condition: service_completed_successfully
    environment:
      LIMIT_POOL_TERMINAL_REQUEST_FILE: /workspace/data/fixtures/limit-pool-terminal-local.json
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-kunlun}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-kunlun}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-kunlun-local-dev}
      CLICKHOUSE_TIMEOUT_SECONDS: "5"
    command: ["limit-pool-terminal-materialize"]
    labels:
      - "kunlun.service=limit-pool-terminal-materialize"
      - "kunlun.description=Canonical local limit-pool terminal materialization"

  server:
    image: kunlun-server:local
    build:
      context: ../..
      dockerfile: Dockerfile
      target: server
    container_name: kunlun-server
    restart: unless-stopped
    init: true
    depends_on:
      server-migrate:
        condition: service_completed_successfully
      data-worker-migrate:
        condition: service_completed_successfully
      clickhouse-migrate:
        condition: service_completed_successfully
      limit-pool-terminal-materialize:
        condition: service_completed_successfully
      local-terminal-reference-materialize:
        condition: service_completed_successfully
      ranking-terminal-materialize:
        condition: service_completed_successfully
      quant-engine:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3002
      AUTH_POSTGRES_DSN: >-
        postgresql://${POSTGRES_USER:-kunlun}:${POSTGRES_PASSWORD:-kunlun-local-dev}@postgres:5432/${POSTGRES_DB:-kunlun}?options=-csearch_path%3Dkunlun%2Cpublic
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:-http://localhost:5173}
      AUTH_ALLOW_INSECURE_COOKIE: ${AUTH_ALLOW_INSECURE_COOKIE:-true}
      MARKET_DATA_SETTINGS_POSTGRES_DSN: ${MARKET_DATA_SETTINGS_POSTGRES_DSN:-}
      MARKET_DATA_SETTINGS_MASTER_KEY: ${MARKET_DATA_SETTINGS_MASTER_KEY:-}
      MARKET_DATA_SETTINGS_MASTER_KEY_FILE: ${MARKET_DATA_SETTINGS_MASTER_KEY_FILE:-}
      MARKET_DATA_SETTINGS_WORKER_TOKEN: ${MARKET_DATA_SETTINGS_WORKER_TOKEN:-}
      CLAIM_REVIEW_POSTGRES_DSN: >-
        postgresql://${POSTGRES_USER:-kunlun}:${POSTGRES_PASSWORD:-kunlun-local-dev}@postgres:5432/${POSTGRES_DB:-kunlun}?options=-csearch_path%3Dkunlun%2Cpublic
      DATA_QUALITY_POSTGRES_DSN: >-
        postgresql://${POSTGRES_USER:-kunlun}:${POSTGRES_PASSWORD:-kunlun-local-dev}@postgres:5432/${POSTGRES_DB:-kunlun}?options=-csearch_path%3Dkunlun%2Cpublic
      EVENT_FEEDBACK_POSTGRES_DSN: >-
        postgresql://${POSTGRES_USER:-kunlun}:${POSTGRES_PASSWORD:-kunlun-local-dev}@postgres:5432/${POSTGRES_DB:-kunlun}?options=-csearch_path%3Dkunlun%2Cpublic
      EVENT_INTELLIGENCE_POSTGRES_DSN: >-
        postgresql://${POSTGRES_USER:-kunlun}:${POSTGRES_PASSWORD:-kunlun-local-dev}@postgres:5432/${POSTGRES_DB:-kunlun}?options=-csearch_path%3Dkunlun%2Cpublic
      INSTRUMENT_INTELLIGENCE_POSTGRES_DSN: >-
        postgresql://${POSTGRES_USER:-kunlun}:${POSTGRES_PASSWORD:-kunlun-local-dev}@postgres:5432/${POSTGRES_DB:-kunlun}?options=-csearch_path%3Dkunlun%2Cpublic
      PRECIOUS_METALS_POSTGRES_DSN: >-
        postgresql://${POSTGRES_USER:-kunlun}:${POSTGRES_PASSWORD:-kunlun-local-dev}@postgres:5432/${POSTGRES_DB:-kunlun}?options=-csearch_path%3Dkunlun%2Cpublic
      WATCHLIST_ALERTS_POSTGRES_DSN: >-
        postgresql://${POSTGRES_USER:-kunlun}:${POSTGRES_PASSWORD:-kunlun-local-dev}@postgres:5432/${POSTGRES_DB:-kunlun}?options=-csearch_path%3Dkunlun%2Cpublic
      WATCHLIST_ALERTS_OWNER_REF: local-research-user
      WATCHLIST_ALERTS_EVALUATION_INTERVAL_SECONDS: ${WATCHLIST_ALERTS_EVALUATION_INTERVAL_SECONDS:-60}
      EMOTION_CLICKHOUSE_URL: http://clickhouse:8123
      EMOTION_CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-kunlun}
      EMOTION_CLICKHOUSE_USER: ${CLICKHOUSE_USER:-kunlun}
      EMOTION_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-kunlun-local-dev}
      INSTRUMENT_INTELLIGENCE_CLICKHOUSE_URL: http://clickhouse:8123
      INSTRUMENT_INTELLIGENCE_CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-kunlun}
      INSTRUMENT_INTELLIGENCE_CLICKHOUSE_USER: ${CLICKHOUSE_USER:-kunlun}
      INSTRUMENT_INTELLIGENCE_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-kunlun-local-dev}
      INSTRUMENT_INTELLIGENCE_CLICKHOUSE_TIMEOUT_MS: ${INSTRUMENT_INTELLIGENCE_CLICKHOUSE_TIMEOUT_MS:-5000}
      PRECIOUS_METALS_CLICKHOUSE_URL: http://clickhouse:8123
      PRECIOUS_METALS_CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB:-kunlun}
      PRECIOUS_METALS_CLICKHOUSE_USER: ${CLICKHOUSE_USER:-kunlun}
      PRECIOUS_METALS_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-kunlun-local-dev}
      PRECIOUS_METALS_CLICKHOUSE_TIMEOUT_MS: ${PRECIOUS_METALS_CLICKHOUSE_TIMEOUT_MS:-5000}
      DASHBOARD_EMOTION_ALGORITHM_VERSION: ${DASHBOARD_EMOTION_ALGORITHM_VERSION:-emotion_score_v1}
      DASHBOARD_CLICKHOUSE_TIMEOUT_MS: ${DASHBOARD_CLICKHOUSE_TIMEOUT_MS:-5000}
      DASHBOARD_TERMINAL_READ_POLICY: public
      PAPER_ENGINE_URL: http://quant-engine:8081
      PAPER_ENGINE_TIMEOUT_MS: ${PAPER_ENGINE_TIMEOUT_MS:-5000}
      QUANT_ENGINE_URL: http://quant-engine:8081
      QUANT_ENGINE_TIMEOUT_MS: ${QUANT_ENGINE_TIMEOUT_MS:-5000}
    ports:
      - "${SERVER_PORT:-3002}:3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/api/v1/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    labels:
      - "kunlun.service=server"
      - "kunlun.description=NestJS control plane"

  quant-engine:
    image: kunlun-quant-engine:local
    build:
      context: ../..
      dockerfile: Dockerfile
      target: quant-engine
    container_name: kunlun-quant-engine
    restart: unless-stopped
    init: true
    environment:
      KUNLUN_LOG_LEVEL: INFO
      KUNLUN_HOST: 0.0.0.0
      KUNLUN_PORT: 8081
      KUNLUN_QUANT_STATE_DIR: /var/lib/kunlun/quant-engine
    volumes:
      - kunlun-quant-state:/var/lib/kunlun/quant-engine
    ports:
      - "${QUANT_ENGINE_PORT:-8081}:8081"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      - "kunlun.service=quant-engine"
      - "kunlun.description=Quant research and paper simulation engine"

  web:
    image: kunlun-web:local
    build:
      context: ../..
      dockerfile: Dockerfile
      target: web
    container_name: kunlun-web
    restart: unless-stopped
    init: true
    depends_on:
      server:
        condition: service_healthy
    environment:
      KUNLUN_SERVER_PROXY_TARGET: http://server:3002
    ports:
      - "${WEB_PORT:-5173}:4173"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4173/event-workbench').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      - "kunlun.service=web"
      - "kunlun.description=React decision terminal"

  sample-engine:
    image: kunlun-sample-engine:local
    build:
      context: ../..
      dockerfile: Dockerfile
      target: sample-engine
    container_name: kunlun-sample-engine
    restart: unless-stopped
    init: true
    environment:
      KUNLUN_SERVICE_NAME: kunlun-sample-engine
      KUNLUN_LOG_LEVEL: INFO
      KUNLUN_HOST: 0.0.0.0
      KUNLUN_PORT: 8080
      KUNLUN_SHUTDOWN_TIMEOUT_SECONDS: 10.0
    ports:
      - "${SAMPLE_ENGINE_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      - "kunlun.service=sample-engine"
      - "kunlun.description=Python service lifecycle reference"

volumes:
  kunlun-market-raw:
    name: ${MARKET_DATA_RAW_VOLUME_NAME:-kunlun-market-raw}
  kunlun-quant-state:
    name: ${QUANT_STATE_VOLUME_NAME:-kunlun-quant-state}

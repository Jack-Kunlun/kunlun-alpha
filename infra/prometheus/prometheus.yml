global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "kunlun-local"
    env: "dev"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "kunlun-api"
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["host.docker.internal:3002"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "kunlun-api"

  - job_name: "kunlun-python"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "kunlun-python"

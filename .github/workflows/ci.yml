name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24.19.0"
  PNPM_VERSION: "11.21.0"
  PYTHON_VERSION: "3.12.13"
  UV_VERSION: "0.12.3"

jobs:
  # Three-OS matrix. All checks are read-only commands routed through
  # pnpm / uv / node scripts (no Bash-specific syntax), so the exact same
  # steps run on every runner. Linux additionally builds all packages and
  # asserts the tree stays clean afterwards.
  quality-gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install pinned Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Bootstrap (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Bootstrap (uv)
        run: uv sync --locked --all-packages

      - name: Line endings
        run: node scripts/ci/check-line-endings.mjs

      - name: CI script regressions
        run: node --test scripts/ci/prettier-check.test.mjs

      # format:check + eslint + ruff + tsc + basedpyright + vitest + pytest
      # (single cross-platform entry, see root package.json)
      - name: Quality gates
        run: pnpm check

      - name: Backtest regression and zero-write snapshot
        run: pnpm backtest:regression

      - name: Clean tree after backtest regression
        run: node scripts/ci/check-clean-tree.mjs

      - name: Build (all packages)
        if: runner.os == 'Linux'
        run: pnpm build

      - name: Clean tree (artifacts gitignored)
        if: runner.os == 'Linux'
        run: node scripts/ci/check-clean-tree.mjs

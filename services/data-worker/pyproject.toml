[project]
name = "data-worker"
version = "0.0.0"
description = "A-share data ingestion worker (raw landing zone, jobs, scheduler)"
requires-python = "==3.12.13"
dependencies = [
    "akshare==1.18.94",
    "ashare-contracts",
    "emotion-core",
    "market-core",
    "quant-core",
    "seat-core",
    "psycopg[binary]==3.3.4",
]

[project.scripts]
personal-watchlist-sync = "data_worker.jobs.market_data.personal_watchlist:main"
limit-pool-terminal-materialize = "data_worker.jobs.limit_pool_terminal.runtime:main"
local-terminal-reference-materialize = "data_worker.jobs.local_reference.runtime:main"
market-data-sync = "data_worker.jobs.market_data.runtime:main"
market-quality-export = "data_worker.jobs.market_data.quality_export:main"
official-sse-calendar-sync = "data_worker.jobs.calendars.official_sse_runtime:main"
official-szse-daily-sync = "data_worker.jobs.calendars.official_szse_runtime:main"
calendar-quality-verify = "data_worker.jobs.calendars.calendar_quality_runtime:main"
calendar-quality-publish = "data_worker.jobs.calendars.calendar_quality_runtime:publish_main"
instrument-master-sync = "data_worker.jobs.instruments.runtime:main"
instrument-master-provider-migrate = "data_worker.jobs.instruments.runtime:migrate_main"
offline-market-replay-check = "data_worker.jobs.offline_market_replay.runtime:main"
ranking-snapshot-materialize = "data_worker.jobs.ranking_snapshot.runtime:main"

[tool.uv.sources]
ashare-contracts = { workspace = true }
emotion-core = { workspace = true }
market-core = { workspace = true }
quant-core = { workspace = true }
seat-core = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"src/data_worker/jobs/seats/seat_collection_migration.sql" = "data_worker/jobs/seats/seat_collection_migration.sql"
"src/data_worker/jobs/calendars/calendar_snapshot_migration.sql" = "data_worker/jobs/calendars/calendar_snapshot_migration.sql"
"src/data_worker/jobs/calendars/official_calendar_migration.sql" = "data_worker/jobs/calendars/official_calendar_migration.sql"
"src/data_worker/jobs/calendars/calendar_quality_migration.sql" = "data_worker/jobs/calendars/calendar_quality_migration.sql"
"src/data_worker/jobs/instruments/instrument_master_migration.sql" = "data_worker/jobs/instruments/instrument_master_migration.sql"

[project]
name = "data-worker"
version = "0.0.0"
description = "A-share data ingestion worker (raw landing zone, jobs, scheduler)"
requires-python = "==3.12.13"
dependencies = [
    "ashare-contracts",
    "market-core",
    "psycopg[binary]==3.3.4",
]

[tool.uv.sources]
ashare-contracts = { workspace = true }
market-core = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

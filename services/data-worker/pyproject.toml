[project]
name = "data-worker"
version = "0.0.0"
description = "A-share data ingestion worker (raw landing zone, jobs, scheduler)"
requires-python = "==3.12.13"
dependencies = [
    "akshare==1.18.94",
    "ashare-contracts",
    "emotion-core",
    "market-core",
    "seat-core",
    "psycopg[binary]==3.3.4",
]

[project.scripts]
limit-pool-terminal-materialize = "data_worker.jobs.limit_pool_terminal.runtime:main"
market-data-sync = "data_worker.jobs.market_data.runtime:main"

[tool.uv.sources]
ashare-contracts = { workspace = true }
emotion-core = { workspace = true }
market-core = { workspace = true }
seat-core = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"src/data_worker/jobs/seats/seat_collection_migration.sql" = "data_worker/jobs/seats/seat_collection_migration.sql"
